<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #222;
        }

        .form-container {
            width: 100%;
            max-width: 850px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .form-header {
            background: #607fc9;
            color: white;
            padding: 25px 35px;
        }

        .form-header h1 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .form-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        form {
            padding: 35px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 25px;
            align-items: center;
            margin-bottom: 20px;
        }

        label,
        .field-label {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #d5d9e2;
            border-radius: 7px;
            padding: 11px 13px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            transition: 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #607fc9;
            box-shadow: 0 0 0 3px rgba(96, 127, 201, 0.15);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        .radio-item,
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            cursor: pointer;
            font-weight: normal;
        }

        .radio-item input,
        .checkbox-item input {
            width: auto;
            cursor: pointer;
            accent-color: #607fc9;
        }

        .file-input {
            padding: 8px;
        }

        .button-row {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e8eaf0;
        }

        button {
            border: none;
            padding: 11px 24px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .submit-btn {
            background: #607fc9;
            color: white;
        }
ShuhaibNC
        .submit-btn:hover {
            background: #4f6fb9;
            transform: translateY(-1px);
        }

        .reset-btn {
            background: #eef1f6;
            color: #444;
        }

        .reset-btn:hover {
            background: #e1e5ec;
        }

        /* Tablet */
        @media (max-width: 700px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 8px;
                margin-bottom: 18px;
            }

            form {
                padding: 25px;
            }

            .form-header {
                padding: 22px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <div class="form-header">
            <h1>Registration Form</h1>
            <p>Please fill in your details to register.</p>
        </div>

        <form>


            <div class="form-row">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >
            </div>

           
            <div class="form-row">
                <label for="mobile">Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter your mobile number"
                    required
                >
            </div>

        
            <div class="form-row">
                <label for="email">Email ID</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

     
            <div class="form-row">
                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    min="1"
                    max="100"
                    placeholder="Enter your age"
                >
            </div>

           
            <div class="form-row">
                <span class="field-label">Gender</span>

                <div class="radio-group">

                    <label class="radio-item">
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="gender" value="others">
                        Others
                    </label>

                </div>
            </div>

            
            <div class="form-row">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
            </div>

            
            <div class="form-row">
                <label for="address">Address</label>
                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your address"
                ></textarea>
            </div>

          
            <div class="form-row">
                <label for="study">Current Study</label>

                <select id="study" name="study">
                    <option value="btech">B.Tech</option>
                    <option value="bsc">B.Sc</option>
                    <option value="bca">BCA</option>
                    <option value="mtech">M.Tech</option>
                    <option value="msc">M.Sc</option>
                    <option value="mca">MCA</option>
                </select>
            </div>

           
            <div class="form-row">
                <label for="department">Department</label>

                <select id="department" name="department">
                    <option value="cs">Computer Science</option>
                    <option value="it">Information Technology</option>
                    <option value="ec">Electronics</option>
                    <option value="ee">Electrical</option>
                    <option value="me">Mechanical</option>
                    <option value="ce">Civil</option>
                </select>
            </div>

     
            <div class="form-row">
                <label for="cv">Upload CV</label>

                <input
                    class="file-input"
                    type="file"
                    id="cv"
                    name="cv"
                    accept=".pdf,.doc,.docx"
                >
            </div>

            
            <div class="form-row">
                <span class="field-label">Programming Languages</span>

                <div class="checkbox-group">

                    <label class="checkbox-item">
                        <input type="checkbox" name="programming" value="html">
                        HTML
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="programming" value="reactjs">
                        ReactJS
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="programming" value="css">
                        CSS
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="programming" value="flutter">
                        Flutter
                    </label>

                </div>
            </div>

          
            <div class="form-row">
                <span class="field-label">Language</span>

                <div class="checkbox-group">

                    <label class="checkbox-item">
                        <input type="checkbox" name="language" value="english">
                        English
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="language" value="malayalam">
                        Malayalam
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="language" value="arabic">
                        Arabic
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" name="language" value="hindi">
                        Hindi
                    </label>

                </div>
            </div>

           
            <div class="button-row">
                <button type="reset" class="reset-btn">
                    Reset
                </button>

                <button type="submit" class="submit-btn">
                    Submit
                </button>
            </div>

        </form>
    </div>

</body>
</html>
